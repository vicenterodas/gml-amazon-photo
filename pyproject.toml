[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gml-amazon-photo"
version = "0.1.0"
description = "Validación y análisis reproducible de Amazon Photo para IIC3641"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",
    "torch-geometric==2.8.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
]

[tool.setuptools.packages.find]
include = ["amazon_photo*"]
